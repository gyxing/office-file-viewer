<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc">
  <title id="title">Office File Viewer architecture flow</title>
  <desc id="desc">Shows how file inputs, viewer control, format detection, parsing sessions, on-demand sources, runtimes, preview state, and renderers work together.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4f46e5"/></marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0e7490"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <style>.t{font-family:Inter,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#172033}.sub{fill:#64748b}.title{font-size:32px;font-weight:700}.nodeTitle{font-size:15px;font-weight:650}.nodeSub{font-size:12px;fill:#64748b}.groupLabel{font-size:14px;font-weight:650;fill:#475569}.note{font-size:12px;fill:#64748b}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.nodePrimary{fill:#4f46e5;stroke:#4338ca;stroke-width:1.5}.nodeViolet{fill:#faf5ff;stroke:#a78bfa;stroke-width:1.5}.nodeCyan{fill:#ecfeff;stroke:#67c5d4;stroke-width:1.5}.nodeGreen{fill:#f0fdf4;stroke:#7bcf96;stroke-width:1.5}.group{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:7 7}.edge{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.edgeBus{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.indigo{fill:none;stroke:#4f46e5;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowIndigo)}.violet{fill:none;stroke:#7c3aed;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowViolet)}.cyan{fill:none;stroke:#0e7490;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowCyan)}.green{fill:none;stroke:#15803d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}.loop{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="1190" fill="#fff"/>
  <g class="t"><text x="60" y="58" class="title">How Office File Viewer works</text><text x="60" y="88" class="sub" font-size="14">From component entry and parsing orchestration to format-specific preview rendering</text>
  <g><rect x="60" y="126" width="330" height="150" rx="12" class="group"/><rect x="76" y="114" width="80" height="24" fill="#fff"/><text x="82" y="132" class="groupLabel">File input</text>
  <rect x="82" y="170" width="82" height="56" rx="8" class="node"/><text x="123" y="194" text-anchor="middle" class="nodeTitle">File</text><text x="123" y="213" text-anchor="middle" class="nodeSub">Local file</text>
  <rect x="184" y="170" width="82" height="56" rx="8" class="node"/><text x="225" y="194" text-anchor="middle" class="nodeTitle">URL</text><text x="225" y="213" text-anchor="middle" class="nodeSub">Remote URL</text>
  <rect x="286" y="170" width="82" height="56" rx="8" class="node"/><text x="327" y="194" text-anchor="middle" class="nodeTitle">Loader</text><text x="327" y="213" text-anchor="middle" class="nodeSub">Async source</text><circle cx="390" cy="198" r="4" fill="#4f46e5"/></g>
  <path d="M164 198H390M266 198H390M368 198H390M394 198H438" class="indigo"/>
  <path d="M620 198H660M850 198H890M1060 198H1100M1290 198H1330" class="indigo"/>
  <rect x="438" y="158" width="182" height="80" rx="10" class="nodePrimary"/><text x="529" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">OfficeFileViewer</text><text x="529" y="214" text-anchor="middle" font-size="12" fill="#e0e7ff">Unified React component</text>
  <rect x="660" y="158" width="190" height="80" rx="10" class="node"/><text x="755" y="190" text-anchor="middle" class="nodeTitle">Viewer Controller</text><text x="755" y="214" text-anchor="middle" class="nodeSub">Source · state · errors</text>
  <rect x="890" y="158" width="170" height="80" rx="10" class="node"/><text x="975" y="190" text-anchor="middle" class="nodeTitle">Format detection</text><text x="975" y="214" text-anchor="middle" class="nodeSub">Extension → PreviewKind</text>
  <rect x="1100" y="158" width="190" height="80" rx="10" class="node"/><text x="1195" y="190" text-anchor="middle" class="nodeTitle">OfficeParseSession</text><text x="1195" y="214" text-anchor="middle" class="nodeSub">Progress · cancel · resources</text>
  <rect x="1330" y="158" width="210" height="80" rx="10" class="node"/><text x="1435" y="190" text-anchor="middle" class="nodeTitle">Format capability registry</text><text x="1435" y="214" text-anchor="middle" class="nodeSub">Loads Parser / Source on demand</text>
  <path d="M1435 238V320H285M1435 320H1275" class="edgeBus"/><circle cx="285" cy="320" r="4" fill="#7c3aed"/><circle cx="785" cy="320" r="4" fill="#0e7490"/><circle cx="1275" cy="320" r="4" fill="#15803d"/>
  <path d="M285 320V370" class="violet"/><path d="M785 320V370" class="cyan"/><path d="M1275 320V370" class="green"/>
  <rect x="155" y="370" width="260" height="78" rx="10" class="nodeViolet"/><text x="285" y="401" text-anchor="middle" class="nodeTitle">Source Factory</text><text x="285" y="425" text-anchor="middle" class="nodeSub">Created on demand for large files</text>
  <rect x="655" y="370" width="260" height="78" rx="10" class="nodeCyan"/><text x="785" y="401" text-anchor="middle" class="nodeTitle">Worker Runtime</text><text x="785" y="425" text-anchor="middle" class="nodeSub">DOC/WPS · XLS · PPT</text>
  <rect x="1145" y="370" width="260" height="78" rx="10" class="nodeGreen"/><text x="1275" y="401" text-anchor="middle" class="nodeTitle">Main Thread Runtime</text><text x="1275" y="425" text-anchor="middle" class="nodeSub">OOXML and Worker fallback</text>
  <path d="M285 448V520" class="violet"/><path d="M785 448V520" class="cyan"/><path d="M1275 448V520" class="green"/>
  <g><rect x="70" y="520" width="430" height="210" rx="12" class="group"/><rect x="88" y="508" width="120" height="24" fill="#fff"/><text x="94" y="526" class="groupLabel">On-demand source path</text>
  <rect x="100" y="570" width="155" height="64" rx="8" class="node"/><text x="177" y="597" text-anchor="middle" class="nodeTitle">Structure index</text><text x="177" y="618" text-anchor="middle" class="nodeSub">Page / Sheet / Slide</text><path d="M255 602H300" class="violet"/>
  <rect x="300" y="570" width="170" height="64" rx="8" class="nodeViolet"/><text x="385" y="597" text-anchor="middle" class="nodeTitle">On-demand Source</text><text x="385" y="618" text-anchor="middle" class="nodeSub">Loads visible content only</text><text x="285" y="686" text-anchor="middle" class="note">DOCX · PPT/PPTX · XLS/XLSX</text></g>
  <g><rect x="550" y="520" width="470" height="210" rx="12" class="group"/><rect x="568" y="508" width="136" height="24" fill="#fff"/><text x="574" y="526" class="groupLabel">Legacy binary parsers</text>
  <rect x="580" y="570" width="115" height="58" rx="8" class="nodeCyan"/><text x="637" y="594" text-anchor="middle" class="nodeTitle">DOC/WPS</text><text x="637" y="614" text-anchor="middle" class="nodeSub">CFB + document streams</text>
  <rect x="727" y="570" width="115" height="58" rx="8" class="nodeCyan"/><text x="784" y="594" text-anchor="middle" class="nodeTitle">XLS</text><text x="784" y="614" text-anchor="middle" class="nodeSub">BIFF8 + OfficeArt</text>
  <rect x="874" y="570" width="115" height="58" rx="8" class="nodeCyan"/><text x="931" y="594" text-anchor="middle" class="nodeTitle">PPT</text><text x="931" y="614" text-anchor="middle" class="nodeSub">PPT Record</text><path d="M637 628V650H785M784 628V650M931 628V650H785M785 650V672" class="edgeBus"/>
  <rect x="690" y="672" width="190" height="40" rx="8" class="node"/><text x="785" y="697" text-anchor="middle" class="nodeTitle">Incremental Assembler</text></g>
  <g><rect x="1060" y="520" width="480" height="210" rx="12" class="group"/><rect x="1078" y="508" width="120" height="24" fill="#fff"/><text x="1084" y="526" class="groupLabel">OOXML parsers</text>
  <rect x="1090" y="570" width="125" height="58" rx="8" class="nodeGreen"/><text x="1152" y="594" text-anchor="middle" class="nodeTitle">DOCX</text><text x="1152" y="614" text-anchor="middle" class="nodeSub">Styles + content</text>
  <rect x="1237" y="570" width="125" height="58" rx="8" class="nodeGreen"/><text x="1299" y="594" text-anchor="middle" class="nodeTitle">XLSX</text><text x="1299" y="614" text-anchor="middle" class="nodeSub">Sheets + charts</text>
  <rect x="1384" y="570" width="125" height="58" rx="8" class="nodeGreen"/><text x="1446" y="594" text-anchor="middle" class="nodeTitle">PPTX</text><text x="1446" y="614" text-anchor="middle" class="nodeSub">Master + Slide</text><path d="M1152 628V650H1300M1299 628V650M1446 628V650H1300M1300 650V672" class="edgeBus"/>
  <rect x="1205" y="672" width="190" height="40" rx="8" class="node"/><text x="1300" y="697" text-anchor="middle" class="nodeTitle">XML model assembly</text></g>
  <path d="M385 634V754H720V782" class="violet"/><path d="M785 712V782" class="cyan"/><path d="M1300 712V754H850V782" class="green"/>
  <rect x="670" y="782" width="230" height="84" rx="10" fill="#172033" stroke="#172033"/><text x="785" y="814" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Unified PreviewState</text><text x="785" y="840" text-anchor="middle" font-size="12" fill="#cbd5e1">mode: source / materialized</text>
  <path d="M785 866V900H355M785 900H1215M355 900V928M785 900V928M1215 900V928" class="edgeBus"/>
  <rect x="245" y="928" width="220" height="68" rx="9" class="node"/><text x="355" y="956" text-anchor="middle" class="nodeTitle">Word Renderer</text><text x="355" y="978" text-anchor="middle" class="nodeSub">DOC/WPS · DOCX</text>
  <rect x="675" y="928" width="220" height="68" rx="9" class="node"/><text x="785" y="956" text-anchor="middle" class="nodeTitle">Spreadsheet Renderer</text><text x="785" y="978" text-anchor="middle" class="nodeSub">XLS · XLSX</text>
  <rect x="1105" y="928" width="220" height="68" rx="9" class="node"/><text x="1215" y="956" text-anchor="middle" class="nodeTitle">Presentation Renderer</text><text x="1215" y="978" text-anchor="middle" class="nodeSub">PPT · PPTX</text>
  <path d="M355 996V1020H785M785 996V1042M1215 996V1020H785" class="edgeBus"/><rect x="650" y="1042" width="270" height="64" rx="10" class="nodePrimary"/><text x="785" y="1068" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PreviewStage + shared viewer shell</text><text x="785" y="1090" text-anchor="middle" font-size="12" fill="#e0e7ff">Toolbar · zoom · fullscreen · format navigation</text>
  <path d="M670 824H555V300H1195V238" class="loop"/><rect x="485" y="282" width="180" height="26" fill="#fff"/><text x="492" y="300" class="note">Progress and partial-state updates</text><path d="M1195 238V282H1525V409H1405" class="loop"/><rect x="1310" y="270" width="170" height="26" fill="#fff"/><text x="1318" y="288" class="note">Cancel and release resources</text>
  <g transform="translate(60 1150)"><line x1="0" y1="0" x2="42" y2="0" class="violet"/><text x="56" y="5" class="note">On-demand Source</text><line x1="180" y1="0" x2="222" y2="0" class="cyan"/><text x="236" y="5" class="note">Worker path</text><line x1="360" y1="0" x2="402" y2="0" class="green"/><text x="416" y="5" class="note">Main-thread path</text><line x1="560" y1="0" x2="602" y2="0" class="loop"/><text x="616" y="5" class="note">Lifecycle loop</text></g>
  <text x="1540" y="1155" text-anchor="end" class="note">WPS reuses the DOC path; only the implementation required by the selected file is loaded.</text></g>
</svg>